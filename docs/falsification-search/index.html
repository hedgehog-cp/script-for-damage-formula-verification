<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>反証可能火力探索</title>
    <link rel="icon" href="../favicon.png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      グラフ機能は無効化済み(falsification-search.js の8節参照)。
      「交戦形態補正」以外の共通行を新規追加した際にグラフへ正しく反映されない
      不具合が見つかり、修正コストに見合わないと判断してコメントアウトした。
      Chart.js (A(x)/B(x)グラフ用)
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
      chartjs-plugin-zoom (グラフのホイールズーム・ドラッグパン用)
      <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
    -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "bg-main": "#F8FAF8",
              "bg-panel": "#FFFFFF",
              "emp-1": "#B4A7D6",
              "emp-2": "#B7E1CD",
              "emp-3": "#FFD966",
              "emp-4": "#FFF2CC",
              "form-a": "#C9DAF8",
              "form-b": "#F4CCCC",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="falsification-search.css" />
  </head>
  <body class="bg-bg-main text-gray-800 text-sm min-h-screen pb-20">
    <!-- D&D 挿入ラインインジケーター本体（1個だけ生成し、JSで位置とサイズを動かして使い回す） -->
    <div id="dropIndicatorLine"></div>

    <!-- ヘッダー -->
    <header
      class="max-w-[1400px] mx-auto px-3 pt-4 flex justify-between items-center"
    >
      <a
        href="../index.html"
        class="flex items-center gap-2 hover:opacity-80 transition"
      >
        <img src="../log.png" alt="kcverify" class="h-10 w-auto shrink-0" />
        <span class="text-lg font-bold text-gray-800">反証可能火力探索</span>
      </a>
      <a
        href="../index.html"
        class="text-xs text-black bg-white/70 px-2 py-1 sheet-border rounded hover:opacity-80 transition"
        >← ツール一覧</a
      >
    </header>

    <main class="max-w-[1400px] mx-auto px-3 mt-4 flex flex-col gap-4">
      <!-- 1. 基本攻撃力 -->
      <section class="bg-bg-panel sheet-border p-3">
        <div
          class="flex items-center gap-2 border-b border-gray-300 pb-1 mb-2 cursor-pointer"
          onclick="toggleSection('section1Body')"
        >
          <span id="section1Chevron" class="text-xs text-gray-500">▼</span>
          <h2 class="font-bold text-purple-900">1. 基本攻撃力</h2>
        </div>

        <div id="section1Body">
          <div class="flex flex-wrap gap-3 mb-3">
            <div class="flex flex-col w-28">
              <label for="baseVal" class="text-xs text-gray-600 mb-1"
                >最低保証火力|夜偵</label
              >
              <input
                type="number"
                id="baseVal"
                value="5"
                min="0"
                step="1"
                class="sheet-input w-full rounded text-left steppable"
                onchange="updateEstimates()"
              />
            </div>
            <div class="flex flex-col w-28">
              <label for="fpVal" class="text-xs text-gray-600 mb-1"
                >表示火力</label
              >
              <input
                type="number"
                id="fpVal"
                value="50"
                min="0"
                step="1"
                class="sheet-input w-full rounded text-left steppable"
                onchange="updateEstimates()"
              />
            </div>
            <div class="flex flex-col w-28">
              <label for="tpVal" class="text-xs text-gray-600 mb-1"
                >表示雷装</label
              >
              <input
                type="number"
                id="tpVal"
                value="0"
                min="0"
                step="1"
                class="sheet-input w-full rounded text-left steppable"
                onchange="updateEstimates()"
              />
            </div>
            <div class="flex flex-col w-28">
              <label for="rangeN" class="text-xs text-gray-600 mb-1"
                >探索範囲</label
              >
              <input
                type="number"
                id="rangeN"
                value="20"
                min="0"
                step="1"
                class="sheet-input w-full rounded text-left steppable"
                onchange="updateEstimates()"
              />
            </div>
            <div class="flex flex-col w-28">
              <label for="slotS" class="text-xs text-gray-600 mb-1"
                >改修スロット数</label
              >
              <select
                id="slotS"
                class="sheet-input w-full rounded text-left"
                onchange="updateEstimates()"
              >
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
              </select>
            </div>
          </div>

          <div
            class="flex flex-col border border-gray-300 p-2 bg-bg-main rounded"
          >
            <label class="text-xs text-gray-600 mb-1">改修効果式</label>
            <div class="flex flex-wrap gap-3" id="formulaCheckboxes">
              <!-- JS Rendered -->
            </div>
          </div>
        </div>
      </section>

      <!-- 2. 部分式の構築 -->
      <section class="bg-bg-panel sheet-border p-3">
        <div
          class="flex flex-wrap justify-between items-center border-b border-gray-300 pb-1 mb-3 gap-2"
        >
          <div
            class="flex items-center gap-2 cursor-pointer"
            onclick="toggleSection('section2Body')"
          >
            <span id="section2Chevron" class="text-xs text-gray-500">▼</span>
            <h2 class="font-bold text-purple-900">2. 部分式の構築</h2>
          </div>
          <div class="flex gap-2">
            <button
              onclick="addCommonRow()"
              class="text-xs text-black bg-white/70 px-2 py-0.5 sheet-border rounded hover:opacity-80 transition"
            >
              + 共通補正を追加
            </button>
          </div>
        </div>

        <div id="section2Body">
          <div class="grid grid-cols-2 gap-2 mb-1 px-1">
            <div
              class="bg-form-a flex flex-wrap items-center justify-between gap-2 px-2 py-1 sheet-border text-xs rounded"
            >
              <span class="font-bold text-black">補正関数 A(x)</span>
              <button
                onclick="addNode('a')"
                class="text-xs text-black bg-white/70 px-2 py-0.5 sheet-border rounded hover:opacity-80 transition"
              >
                + 補正を追加
              </button>
            </div>
            <div
              class="bg-form-b flex flex-wrap items-center justify-between gap-2 px-2 py-1 sheet-border text-xs rounded"
            >
              <span class="font-bold text-black">近似関数 B(x)</span>
              <div class="flex flex-wrap gap-1">
                <button
                  onclick="duplicateAtoB()"
                  class="text-xs text-black bg-white/70 px-2 py-0.5 sheet-border rounded hover:opacity-80 transition"
                >
                  A(x)をB(x)に複製
                </button>
                <button
                  onclick="addNode('b')"
                  class="text-xs text-black bg-white/70 px-2 py-0.5 sheet-border rounded hover:opacity-80 transition"
                >
                  + 補正を追加
                </button>
              </div>
            </div>
          </div>

          <!-- パイプラインコンテナ（パイプライン全体を囲む外枠。枠線はここと各ステップカードのみに絞っている） -->
          <div
            id="pipelineContainer"
            class="flex flex-col gap-1 min-h-[150px] bg-bg-main p-1 sheet-border rounded"
          >
            <!-- JS Rendered -->
          </div>
        </div>
      </section>

      <!-- 3. 結果出力 -->
      <section id="resultsSection" class="bg-bg-panel sheet-border p-3 rounded">
        <div
          class="border-b border-gray-300 pb-1 mb-3 flex flex-wrap justify-between items-center gap-2"
        >
          <div class="flex items-center gap-2">
            <div
              class="flex items-center gap-2 cursor-pointer"
              onclick="toggleSection('resultsBody')"
            >
              <span id="resultsChevron" class="text-xs text-gray-500">▼</span>
              <h2 class="font-bold text-purple-900">
                3. 探索結果
                <span class="text-xs text-gray-600 font-normal"
                  >(不一致のみ抽出)</span
                >
              </h2>
              <span
                id="resultCount"
                class="bg-gray-800 text-white px-2 py-0.5 text-xs font-bold rounded"
                >0 件</span
              >
            </div>
            <button
              onclick="copyResultsAsTsv()"
              class="text-xs text-black bg-white/70 px-2 py-0.5 sheet-border rounded hover:opacity-80 transition"
            >
              結果をTSVでコピー
            </button>
            <label
              class="flex items-center gap-1 text-xs text-gray-600"
              title="探索実行ボタンを押した時点の値が反映されます"
            >
              表示桁数:
              <input
                type="number"
                id="displayDecimals"
                value="5"
                min="0"
                max="10"
                step="1"
                class="sheet-input steppable w-14 text-left"
              />
            </label>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-600"
              >総探索パターン概算:
              <span
                id="estimateDisplay"
                class="font-mono font-bold text-purple-800 text-base"
                >0</span
              >
              パターン</span
            >
            <button
              id="executeBtn"
              onclick="executeSearch()"
              class="bg-emp-2 text-gray-800 font-bold px-4 py-1 sheet-border rounded text-sm hover:opacity-80 transition shadow-sm disabled:opacity-60 disabled:cursor-not-allowed"
            >
              総当たり探索を実行
            </button>
          </div>
        </div>
        <div id="resultsBody">
          <p class="text-xs text-gray-500 mb-1">
            列見出しをクリックでソート / Shift+クリックで第2キー以降を追加
          </p>
          <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
            <!--
              table-fixed(table-layout:fixed)にしているのは性能対策。既定の
              table-layout:autoは、列幅を決めるのにテーブル内の全行のセル内容を
              見る必要があり、結果件数が多い(数千〜数万行)とウィンドウのリサイズ
              (=利用可能な幅の変化)のたびに全行を再計算してしまい、非常に重くなる
              不具合があった。table-fixedなら列幅は見出し行(colgroup)だけで決まり、
              行数に依存しなくなる。そのぶん各列の幅を明示する必要があるため、
              下のcolgroupで指定している(RESULT_COLUMNS の並び順と対応させること)。
            -->
            <table class="w-full text-left border-collapse text-xs table-fixed">
              <colgroup>
                <col style="width: 8%" />
                <!-- x -->
                <col style="width: 32%" />
                <!-- 改修効果 -->
                <col style="width: 16%" />
                <!-- 共通分岐 -->
                <col style="width: 14%" />
                <!-- A(x) -->
                <col style="width: 14%" />
                <!-- B(x) -->
                <col style="width: 16%" />
                <!-- A(x)-B(x) -->
              </colgroup>
              <thead
                class="bg-gray-200 sticky top-0 z-10 shadow-sm border-b border-gray-400"
              >
                <tr id="resultHeader" class="text-gray-700">
                  <!-- JS Rendered -->
                </tr>
              </thead>
              <tbody id="resultBody">
                <!-- JS Rendered -->
              </tbody>
            </table>
          </div>
          <div
            class="flex items-center justify-between gap-2 mt-2 text-xs text-gray-600"
          >
            <span id="paginationRange">0–0 / 全0件</span>
            <div class="flex items-center gap-1">
              <button
                id="prevPageBtn"
                onclick="changePage(-1)"
                class="px-2 py-0.5 sheet-border rounded bg-white/70 hover:opacity-80 transition disabled:opacity-40 disabled:cursor-not-allowed"
              >
                ← 前へ
              </button>
              <button
                id="nextPageBtn"
                onclick="changePage(1)"
                class="px-2 py-0.5 sheet-border rounded bg-white/70 hover:opacity-80 transition disabled:opacity-40 disabled:cursor-not-allowed"
              >
                次へ →
              </button>
            </div>
          </div>
        </div>
      </section>

      <!--
        4. A(x)/B(x) グラフ (無効化)
        【廃止履歴】A(x)/B(x)をChart.jsで折れ線グラフ表示する機能を実装したが、
        「交戦形態補正」以外の共通行(共通補正)を新規追加した場合に、その内容が
        グラフに正しく反映されない不具合が見つかった。原因調査・修正の手間が
        見合わないとユーザーが判断したため、要素を削除せず以下をまとめて
        コメントアウトして無効化した(復活させたい場合はここを参照。
        falsification-search.js の8節、および <head> のChart.js読み込みも
        あわせてコメントアウトしてある)。

      [[ 4. A(x)/B(x) グラフ ]]
      <section class="bg-bg-panel sheet-border p-3 rounded">
        <div
          class="border-b border-gray-300 pb-1 mb-3 flex items-center gap-2 cursor-pointer"
          onclick="toggleSection('graphBody')"
        >
          <span id="graphChevron" class="text-xs text-gray-500">▼</span>
          <h2 class="font-bold text-purple-900">4. A(x)/B(x) グラフ</h2>
        </div>
        <div id="graphBody">
          [[ 表示モード切替: 同じグラフ領域を「A(x)/B(x)表示」⇔「差分表示」で切り替える ]]
          <div class="flex gap-2 mb-3">
            <button
              id="graphModeAbBtn"
              onclick="setGraphMode('ab')"
              class="text-xs px-2 py-0.5 sheet-border rounded transition"
            >
              A(x)/B(x)表示
            </button>
            <button
              id="graphModeDiffBtn"
              onclick="setGraphMode('diff')"
              class="text-xs px-2 py-0.5 sheet-border rounded transition"
            >
              差分表示
            </button>
          </div>
          <div class="flex flex-wrap justify-between items-end gap-3 mb-3">
            [[ 共通行(交戦形態補正など)が複数候補を持つ場合、グラフ計算に使う候補を選ぶプルダウン ]]
            <div id="graphBranchSelectors" class="flex flex-wrap gap-3">
              [[ JS Rendered ]]
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-gray-500"
                >ホイール: ズーム / ドラッグ: パン</span
              >
              <button
                onclick="abChart.resetZoom()"
                class="text-xs text-black bg-white/70 px-2 py-0.5 sheet-border rounded hover:opacity-80 transition"
              >
                ズームをリセット
              </button>
            </div>
          </div>
          <div class="bg-bg-main sheet-border rounded p-2 h-80">
            <canvas id="abChart"></canvas>
          </div>
        </div>
      </section>

      -->
    </main>

    <script src="search-core.js"></script>
    <script src="falsification-search.js"></script>
  </body>
</html>
