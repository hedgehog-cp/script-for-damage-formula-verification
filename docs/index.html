<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ダメージ検証用スプレ改 - 補助ツール</title>
    <link rel="icon" href="favicon.png" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f8faf8;
        color: #1f2937;
        max-width: 640px;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }
      header img {
        height: 40px;
        width: auto;
        flex-shrink: 0;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      li {
        background: #ffffff;
        border: 1px solid #a0aec0;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        transition:
          box-shadow 0.15s,
          transform 0.15s;
      }
      li:hover {
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
      }
      a.tool-link {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.1rem;
        color: #1f2937;
        text-decoration: none;
        border-left: 4px solid #b4a7d6;
        transition: background-color 0.15s;
      }
      a.tool-link:hover {
        background: #f8faf8;
      }
      a.tool-link::after {
        content: "›";
        font-size: 1.4rem;
        line-height: 1;
        font-weight: normal;
        color: #b4a7d6;
      }
      .tool-name {
        display: block;
        font-weight: bold;
        font-size: 0.95rem;
      }
      .tool-desc {
        display: block;
        font-size: 0.7rem;
        color: #9ca3af;
        margin-top: 0.2rem;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="log.png" alt="kcverify" />
      <h1>ダメージ検証用スプレ改 - 補助ツール</h1>
    </header>
    <ul>
      <li>
        <a class="tool-link" href="falsification-search/">
          <span>
            <span class="tool-name">反証可能火力探索</span>
            <span class="tool-desc"
              >ある補正関数A(x)の確度を向上するために、近似関数B(x)を定めてA(x)≠B(x)となる反証可能火力xを探索します。</span
            >
          </span>
        </a>
      </li>
    </ul>
  </body>
</html>
